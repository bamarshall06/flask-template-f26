# CI for the template itself.
#
# "Use this template" copies this directory into every student repo, so every
# job carries a guard that makes the whole workflow a silent no-op there.
# Without it, 30-odd private repos each burn Actions minutes on a MySQL
# container and show their owner a red X they did not cause.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  boot:
    name: Runs with no configuration
    if: github.repository == 'bamarshall06/flask-template-f26'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.5'
      - run: pip install -r requirements.txt
      - name: Import with an empty environment
        run: python -c "import app"
      - name: Every page answers, and /examples explains itself
        run: |
          python - <<'PY'
          import app
          c = app.app.test_client()
          got = {p: c.get(p).status_code for p in ('/', '/about', '/examples', '/healthz', '/nope')}
          print(got)
          expected = {'/': 200, '/about': 200, '/examples': 503, '/healthz': 200, '/nope': 404}
          assert got == expected, f"expected {expected}, got {got}"
          body = c.get('/examples').get_data(as_text=True)
          assert 'DATABASE_URL' in body, "the no-database page must name DATABASE_URL"
          assert c.get('/healthz').get_json()['database'] is False
          PY
      - name: Gunicorn config is valid
        run: gunicorn --check-config app:app

  db:
    name: Works against a real MySQL
    if: github.repository == 'bamarshall06/flask-template-f26'
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.5'
      - run: pip install -r requirements.txt
      - name: Load the schema and the seed rows
        run: |
          mysql -h 127.0.0.1 -P 3306 -uroot -proot test < database/schema.sql
          mysql -h 127.0.0.1 -P 3306 -uroot -proot test < database/seed_data.sql
      - name: CRUD against the real driver
        env:
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/test
        run: |
          python - <<'PY'
          import app
          c = app.app.test_client()
          r = c.get('/examples')
          assert r.status_code == 200, r.status_code
          assert 'First example' in r.get_data(as_text=True)
          assert c.get('/healthz').get_json()['database'] is True
          c.post('/examples/add', data={'name': 'ci row', 'description': 'added by CI'},
                 follow_redirects=True)
          assert 'ci row' in c.get('/examples').get_data(as_text=True)
          PY

  contract:
    name: Still matches what the lessons say
    if: github.repository == 'bamarshall06/flask-template-f26'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The lines the course quotes verbatim
        run: |
          set -e
          grep -q 'navbar navbar-expand-lg navbar-dark bg-dark' templates/base.html
          test "$(grep -c 'bootstrap@5.3.0' templates/base.html)" -eq 2
          test "$(cat Procfile)" = "web: gunicorn app:app"
          grep -q '^gunicorn==' requirements.txt
          grep -q 'examples_bp = Blueprint' blueprints/examples.py
          grep -q '^python-3.12.5$' runtime.txt
          echo "all contract checks passed"
